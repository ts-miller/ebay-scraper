<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; background-color: #f9fafb; }
        h2 { margin-top: 0; font-size: 18px; color: #111827; }
        
        .status-container { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
        .status-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 14px; color: #4b5563; }
        .status-item:last-child { margin-bottom: 0; }
        .status-icon { width: 16px; height: 16px; margin-right: 8px; border-radius: 50%; display: inline-block; }
        
        .success { color: #059669; }
        .success .status-icon { background-color: #34d399; } /* Green */
        .error { color: #dc2626; }
        .error .status-icon { background-color: #f87171; } /* Red */
        .pending .status-icon { background-color: #d1d5db; } /* Gray */

        button {
            display: block; width: 100%; padding: 10px; margin-bottom: 8px;
            border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s; font-size: 14px;
        }
        
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-primary:disabled { background-color: #93c5fd; cursor: not-allowed; opacity: 0.7; }

        .btn-secondary { background-color: #ffffff; color: #374151; border: 1px solid #d1d5db; }
        .btn-secondary:hover { background-color: #f3f4f6; }
        .btn-secondary:disabled { background-color: #f9fafb; cursor: not-allowed; opacity: 0.6; }

        .format-toggle { 
            background: white; 
            border: 1px solid #e5e7eb; 
            border-radius: 8px; 
            padding: 12px; 
            margin-bottom: 16px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .format-toggle label { 
            font-size: 14px; 
            font-weight: 500; 
            color: #374151; 
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #d1d5db;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #7c3aed;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .format-label {
            font-size: 12px;
            color: #6b7280;
            margin-left: 8px;
        }

        #message { font-size: 12px; text-align: center; margin-top: 8px; min-height: 16px; color: #059669; }
    </style>
</head>
<body>
    <h2>eBay Search Exporter</h2>

    <div class="status-container">
        <div id="check-url" class="status-item pending">
            <span class="status-icon"></span>
            <span class="text">Checking URL...</span>
        </div>
        <div id="check-dom" class="status-item pending">
            <span class="status-icon"></span>
            <span class="text">Checking Results...</span>
        </div>
    </div>

    <div class="format-toggle">
        <div>
            <label for="format-toggle-input">Export Format</label>
            <span class="format-label" id="format-label">JSON</span>
        </div>
        <label class="toggle-switch">
            <input type="checkbox" id="format-toggle-input">
            <span class="slider"></span>
        </label>
    </div>

    <button id="btn-copy" class="btn-primary" disabled>Copy JSON to Clipboard</button>
    <button id="btn-download" class="btn-secondary" disabled>Download .json File</button>
    <div style="height: 10px;"></div>
    <button id="btn-scrape-all" class="btn-primary" style="background-color: #7c3aed;">Scrape All Pages (Auto)</button>

    <div id="message"></div>

    <script src="zon-formatter.js"></script>
    <script src="popup.js"></script>
</body>
</html>
